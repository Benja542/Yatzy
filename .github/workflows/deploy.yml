name: Udgiv til GitHub Pages

# Kører kun når den startes i hånden (Actions -> denne workflow -> Run workflow),
# så den ikke overskriver et eksisterende site ved et uheld.
# Skal den køre ved hver push til main, fjernes kommentaren nedenfor.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test --configuration Release

      - name: Udgiv Blazor-appen
        run: dotnet publish src/Yatzy.Web --configuration Release --output publish

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
